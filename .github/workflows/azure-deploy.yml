name: Azure deploy (app)

# Builds and ships app code to the infra provisioned by azure-infra.yml:
#   - backend/  -> container image -> Azure Container App
#   - frontend  -> static build    -> Azure Static Web App
# Does not touch infrastructure — run azure-infra.yml first (once) so these resources already exist.
on:
  workflow_dispatch: {}
  push:
    branches: [main, preview]

permissions:
  id-token: write
  contents: read
  packages: write   # push the backend image to GHCR

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'lunarnav-dev-rg' }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'lunarnavdev-api' }}
  STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME || 'lunarnavdev-web' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal)
        if: ${{ vars.AZURE_CLIENT_ID == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The image goes to GitHub Container Registry as a PUBLIC package, not ACR: the Azure for Students
      # Container Apps environment is "Express" mode, which rejected every private-registry pull we tried
      # (managed identity, ACR admin creds, ACR scoped tokens). A public image needs no credentials, and
      # this repo is public anyway, so the image exposes nothing new.
      - name: Build + push backend image (GHCR)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lunar-navigator-api"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"             -t "$image:${{ github.sha }}" -t "$image:latest" .
          docker push --all-tags "$image"

      - name: Deploy image to Container App
        run: |
          az containerapp update             --name "$CONTAINER_APP_NAME"             --resource-group "$RESOURCE_GROUP"             --image "$IMAGE:${{ github.sha }}"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal)
        if: ${{ vars.AZURE_CLIENT_ID == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Fetch the Static Web App deploy token at run time instead of storing it as a repo secret.
      - name: Get Static Web App deploy token
        run: |
          token=$(az staticwebapp secrets list --name "$STATIC_WEB_APP_NAME" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # Point the built site at the Container App directly (Static Web Apps can't link an Express-mode
      # Container App as its /api backend; Azure returns 500 on the link).
      - name: Resolve backend URL
        run: echo "VITE_API_ORIGIN=https://$(az containerapp show -n "$CONTAINER_APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"

      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
