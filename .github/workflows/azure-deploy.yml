name: Azure deploy (app)

# Builds and ships app code to the infra provisioned by azure-infra.yml:
#   - backend/  -> container image -> Azure Container App
#   - frontend  -> static build    -> Azure Static Web App
# Does not touch infrastructure — run azure-infra.yml first (once) so these resources already exist.
on:
  workflow_dispatch: {}
  push:
    branches: [infra/azure]   # change to `main` once this branch is merged

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'lunarnav-dev-rg' }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'lunarnavdev-api' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal)
        if: ${{ vars.AZURE_CLIENT_ID == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # az acr build builds the image inside ACR itself and pushes it — no local Docker daemon or
      # registry login needed on the runner.
      - name: Build + push backend image
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "lunar-navigator-api:${{ github.sha }}" \
            --image "lunar-navigator-api:latest" \
            .

      - name: Deploy image to Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/lunar-navigator-api:${{ github.sha }}"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
