name: Azure deploy (app)

# Builds and ships app code to the infra provisioned by azure-infra.yml:
#   - backend/  -> container image -> Azure Container App
#   - frontend  -> static build    -> Azure Static Web App
# Does not touch infrastructure — run azure-infra.yml first (once) so these resources already exist.
on:
  workflow_dispatch: {}
  push:
    branches: [main, preview]

permissions:
  id-token: write
  contents: read
  packages: write   # push the backend image to GHCR

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'lunarnav-dev-rg' }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'lunarnavdev-api' }}
  STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME || 'lunarnavdev-web' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal)
        if: ${{ vars.AZURE_CLIENT_ID == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The image goes to GitHub Container Registry as a PUBLIC package, not ACR: the Azure for Students
      # Container Apps environment is "Express" mode, which rejected every private-registry pull we tried
      # (managed identity, ACR admin creds, ACR scoped tokens). A public image needs no credentials, and
      # this repo is public anyway, so the image exposes nothing new.
      - name: Build + push backend image (GHCR)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lunar-navigator-api"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"             -t "$image:${{ github.sha }}" -t "$image:latest" .
          docker push --all-tags "$image"

      # The public site calls the Container App directly (VITE_API_ORIGIN). Also link it as the
      # Static Web App backend so /api/* resolves. `backends show` 500s right after a link; retry
      # verification instead of failing the deploy on that transient error.
      - name: Ensure Static Web App linked backend exists
        run: |
          container_app_id=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv)
          az staticwebapp backends link \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --backend-resource-id "$container_app_id" \
            --backend-region westus2 || echo "link call returned non-zero (may already be linked, or a transient API error — verifying below)"
          echo "--- linked backends after link (retrying: this endpoint 500s immediately after a link/update) ---"
          verified=0
          for attempt in 1 2 3 4 5; do
            if az staticwebapp backends show --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP" -o json; then
              verified=1
              break
            fi
            echo "Verification attempt $attempt failed; waiting 20s..."
            sleep 20
          done
          if [ "$verified" != 1 ]; then
            echo "::warning::Could not verify the linked backend after 5 attempts, but the link call itself may still have succeeded. Direct Container App URL still deploys."
          fi

      # Express-mode Container Apps cannot pull a private ACR image, so the image above is the public
      # GHCR tag. Retry the update itself: Container App reconciliation is often transient.
      - name: Deploy image to Container App
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt/5: updating image..."
            if az containerapp update \
                 --name "$CONTAINER_APP_NAME" \
                 --resource-group "$RESOURCE_GROUP" \
                 --image "$IMAGE:${{ github.sha }}"; then
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed; waiting 30s..."
            sleep 30
          done
          echo "::error::Container App update failed after 5 attempts."
          exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal)
        if: ${{ vars.AZURE_CLIENT_ID == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Fetch the Static Web App deploy token at run time instead of storing it as a repo secret.
      - name: Get Static Web App deploy token
        run: |
          token=$(az staticwebapp secrets list --name "$STATIC_WEB_APP_NAME" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # Point the built site at the Container App directly (Static Web Apps can't link an Express-mode
      # Container App as its /api backend; Azure returns 500 on the link).
      - name: Resolve backend URL
        run: echo "VITE_API_ORIGIN=https://$(az containerapp show -n "$CONTAINER_APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"

      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
