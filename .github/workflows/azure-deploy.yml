name: Azure deploy (app)

# Builds and ships app code to the infra provisioned by azure-infra.yml:
#   - backend/  -> container image -> Azure Container App
#   - frontend  -> static build    -> Azure Static Web App
# Does not touch infrastructure — run azure-infra.yml first (once) so these resources already exist.
on:
  workflow_dispatch: {}
  push:
    # Prod deploys from `main` only. There is a single (production) Static Web App + Container App,
    # so deploying `preview` here overwrote prod with a stale, backend-less build. Deploy preview to a
    # dedicated staging SWA if one is ever provisioned; until then it must not ship to prod.
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'lunarnav-dev-rg' }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'lunarnavdev-api' }}
  STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME || 'lunarnavdev-web' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal)
        if: ${{ vars.AZURE_CLIENT_ID == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The registry's real name has a uniqueString() suffix from the bicep deploy (not predictable
      # ahead of time), so look it up by resource group instead of requiring a hand-set repo variable
      # — the same pattern already used below for the Static Web App deploy token.
      - name: Resolve Container Registry name
        run: |
          acr_name=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          if [ -z "$acr_name" ]; then
            echo "::error::No Container Registry found in resource group $RESOURCE_GROUP — run azure-infra.yml first."
            exit 1
          fi
          echo "ACR_NAME=$acr_name" >> "$GITHUB_ENV"

      # Build on the runner and push: ACR Tasks (`az acr build`) is disabled on Azure for Students
      # subscriptions (TasksOperationsNotAllowed).
      - name: Build + push backend image
        run: |
          az acr login --name "$ACR_NAME"
          docker build -t "$ACR_NAME.azurecr.io/lunar-navigator-api:${{ github.sha }}" -t "$ACR_NAME.azurecr.io/lunar-navigator-api:latest" .
          docker push --all-tags "$ACR_NAME.azurecr.io/lunar-navigator-api"

      # Best-effort, non-blocking: linking the backend is what makes /api/* same-origin on the public
      # SWA URL (see src/science/backend.ts — the frontend already calls relative `api/...` paths).
      # Confirmed via a raw ARM REST PUT to the linkedBackends resource (bypassing the CLI, whose
      # failsafe deserialization was hiding the real error): the failure is a genuine 500 from the
      # Azure Static Web Apps service itself ("500: Internal Server Error ... we're working on an
      # unexpected error right now"), not a credentials/config/region problem on our side — ACR,
      # the container app, and the SWA's own sku/config all check out fine independently. This is
      # outside what a deploy workflow can fix; retry occasionally, and if it keeps failing, use the
      # Azure Portal's "Link already deployed backend" button on the Static Web App resource directly,
      # or open an Azure support ticket. Not fatal to the deploy either way — the Container App is
      # independently reachable at its own FQDN regardless of whether this link succeeds.
      - name: Attempt to link Static Web App backend (best-effort, non-blocking)
        continue-on-error: true
        run: |
          container_app_id=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv)
          az staticwebapp backends link \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --backend-resource-id "$container_app_id" \
            --backend-region westus2

      # Diagnosed: ACR is fine (publicNetworkAccess enabled, admin enabled, image tag present, registry
      # config on the app is correct) but `az containerapp registry set` triggers an immediate
      # reconciliation that reliably fails with "Authentication failed ... Provide 'registryCredentials'"
      # before the new/re-set credential has propagated to the Container Apps pull path — on Express/
      # Consumption (Azure for Students) this propagation lag is consistently 30s+. `registry set`'s own
      # reconciliation failure is not fatal (`|| true`); what matters is the credential being saved, which
      # happens regardless of whether that immediate reconcile succeeds. Retry the real deploy step after
      # giving it time, re-asserting the credential each attempt since it's idempotent.
      - name: Deploy image to Container App (retry for credential-propagation lag)
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt/5: refreshing registry credential..."
            acr_password=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)
            az containerapp registry set \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --server "$ACR_NAME.azurecr.io" \
              --username "$ACR_NAME" \
              --password "$acr_password" || true
            echo "Attempt $attempt/5: updating image..."
            if az containerapp update \
                 --name "$CONTAINER_APP_NAME" \
                 --resource-group "$RESOURCE_GROUP" \
                 --image "$ACR_NAME.azurecr.io/lunar-navigator-api:${{ github.sha }}"; then
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed; waiting 30s for credential propagation..."
            sleep 30
          done
          echo "::error::Container App update failed after 5 attempts."
          exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal)
        if: ${{ vars.AZURE_CLIENT_ID == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Fetch the Static Web App deploy token at run time instead of storing it as a repo secret.
      - name: Get Static Web App deploy token
        run: |
          token=$(az staticwebapp secrets list --name "$STATIC_WEB_APP_NAME" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
