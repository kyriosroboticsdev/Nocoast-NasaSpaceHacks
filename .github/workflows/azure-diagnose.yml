name: Azure diagnose (temporary)

# One-off diagnostic run to debug the Container App image-pull failure. Not part of the real deploy
# pipeline — safe to delete once the underlying issue is found and fixed.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'lunarnav-dev-rg' }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'lunarnavdev-api' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Container Registry name
        run: |
          acr_name=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          echo "ACR_NAME=$acr_name" >> "$GITHUB_ENV"
          echo "acr_name resolved: $acr_name"

      - name: ACR details
        run: |
          echo "--- all ACRs in resource group ---"
          az acr list --resource-group "$RESOURCE_GROUP" -o table
          echo "--- public network access ---"
          az acr show --name "$ACR_NAME" --query "{name:name, publicNetworkAccess:publicNetworkAccess, adminEnabled:adminUserEnabled}" -o json
          echo "--- repository tags ---"
          az acr repository show-tags --name "$ACR_NAME" --repository lunar-navigator-api -o table || echo "repository lookup failed"
          echo "--- network rule set ---"
          az acr show --name "$ACR_NAME" --query "networkRuleSet" -o json

      - name: Container App config + revisions
        run: |
          echo "--- container app registries config ---"
          az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "{provisioningState:properties.provisioningState, registries:properties.configuration.registries, activeImage:properties.template.containers[0].image}" -o json
          echo "--- revisions ---"
          az containerapp revision list --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, active:properties.active, provisioningState:properties.provisioningState, healthState:properties.healthState, createdTime:properties.createdTime}" -o table
          echo "--- latest revision replica status (shows the actual pull error) ---"
          latest=$(az containerapp revision list --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          az containerapp revision show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$latest" \
            --query "{name:name, provisioningState:properties.provisioningState, runningState:properties.runningState, replicas:properties.replicas}" -o json || true
