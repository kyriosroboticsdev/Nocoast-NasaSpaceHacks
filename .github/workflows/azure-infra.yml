name: Azure infra (provision)

# Manual only — this creates/updates the resource group and everything in infra/main.bicep. Run once
# up front, and again only when infra/ itself changes. Deploying app code on every push is handled by
# azure-deploy.yml instead, so this never runs unattended.
on:
  workflow_dispatch:
    inputs:
      location:
        description: "Azure region"
        required: false
        default: "eastus2"

permissions:
  id-token: write   # for OIDC login (azure/login@v2 with federated credentials)
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needs one of these secret sets configured in the repo (Settings -> Secrets and variables ->
      # Actions) before this workflow can run — see docs/AZURE.md for exactly what to create and why:
      #   OIDC (recommended): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
      #   or classic:          AZURE_CREDENTIALS (service principal JSON)
      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal)
        if: ${{ vars.AZURE_CLIENT_ID == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep (subscription scope)
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: ${{ inputs.location }}
          template: infra/main.bicep
          parameters: infra/main.parameters.json
