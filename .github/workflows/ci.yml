name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single required check. Each step only runs once that part of the stack exists,
  # so this stays green on an empty repo and tightens automatically as code lands.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Python (ephemeris / horizon-mask backend) ----------
      - name: Set up Python
        if: hashFiles('**/requirements*.txt', '**/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        if: hashFiles('**/requirements*.txt', '**/pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          for f in $(git ls-files '*requirements*.txt'); do pip install -r "$f"; done
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Lint (ruff)
        if: hashFiles('**/*.py') != ''
        run: ruff check . --output-format=github

      - name: Tests (pytest)
        if: hashFiles('**/test_*.py', '**/*_test.py') != ''
        run: pytest -q

      # ---------- Frontend ----------
      - name: Set up Node
        if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend install, lint, build
        if: hashFiles('**/package.json') != ''
        run: |
          for pkg in $(git ls-files '*package.json' | grep -v node_modules); do
            dir=$(dirname "$pkg"); echo "::group::$dir"
            (cd "$dir" && (npm ci || npm install) \
              && npm run --if-present lint \
              && npm run --if-present test \
              && npm run --if-present build) || exit 1
            echo "::endgroup::"
          done

      - name: Guard against huge files (DEMs, kernels)
        run: |
          big=$(git ls-files -z | xargs -0 du -k 2>/dev/null | awk '$1 > 50000 {print $2}')
          if [ -n "$big" ]; then
            echo "::error::Files over 50 MB committed (keep DEMs/SPICE kernels out of git, download them in a script):"
            echo "$big"; exit 1
          fi
