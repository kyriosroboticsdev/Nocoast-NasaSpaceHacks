name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and fork PRs (forks don't get secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated verifier for this NASA Space Apps project
            (lunar south-pole Sun/Earth visibility tool). Follow CLAUDE.md.

            Review this PR's diff and verify:
            1. Correctness bugs: logic errors, crashes, broken imports, unhandled edge cases.
            2. Physics / geometry: azimuth/elevation conventions, degrees vs radians,
               UTC vs TDB, lunar radius 1737.4 km, curvature drop d^2/(2R) in horizon masks,
               Sun/Earth treated as discs (not points) near the horizon, MOON_ME vs MOON_PA frames.
            3. Data hygiene: no DEMs/SPICE kernels/large binaries committed, no secrets.
            4. The PR does what its description says.

            Use inline comments (mcp__github_inline_comment__create_inline_comment) for
            specific line issues. Then post ONE summary comment with `gh pr comment` that starts with
            either "✅ Verified" or "⚠️ Changes suggested", followed by a short bullet list.
            Be concise; skip style nitpicks. Do not approve or merge.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
